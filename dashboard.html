<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard | Wakala</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root { --ink:#0D1420; --paper:#FBF7EF; --gold:#E4A445; --teal:#229175; --muted:#726A58; }
		* { box-sizing:border-box; }
		body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:Inter,sans-serif; }
		header { display:flex; align-items:center; justify-content:space-between; padding:24px max(24px,calc((100% - 1120px) / 2)); background:var(--ink); color:#F5F1E7; }
		.brand { color:#F5F1E7; font:600 24px Fraunces,serif; text-decoration:none; }
		.dot { display:inline-block; width:9px; height:9px; margin-right:9px; border-radius:50%; background:var(--gold); vertical-align:2px; }
		button { padding:10px 16px; border:1px solid rgba(245,241,231,.3); border-radius:8px; background:transparent; color:#F5F1E7; font:600 13px Inter,sans-serif; cursor:pointer; }
		main { width:min(1120px,100%); margin:0 auto; padding:64px 24px; }
		.eyebrow { color:var(--teal); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
		h1 { margin:12px 0 8px; font:600 clamp(40px,6vw,72px)/1 Fraunces,serif; }
		p { color:var(--muted); line-height:1.7; }
		.balance { max-width:560px; margin-top:44px; padding:28px; border-radius:16px; background:#fff; box-shadow:0 18px 50px rgba(13,20,32,.1); }
		.balance-label { color:var(--muted); font-size:13px; }
		.balance-value { margin-top:10px; font:600 42px Fraunces,serif; }
		.status { margin-top:24px; color:var(--teal); font-size:13px; }
	</style>
</head>
<body>
	<header>
		<a class="brand" href="index.html"><span class="dot"></span>WAKALA</a>
		<button id="logoutButton" type="button">Log out</button>
	</header>
	<main>
		<div class="eyebrow">Your wallet</div>
		<h1 id="welcome">Welcome back.</h1>
		<p>Your Wakala account is ready. Wallet balances and transfers will appear here as the product develops.</p>
		<section class="balance" aria-label="Wallet balance">
			<div class="balance-label">Available balance</div>
			<div class="balance-value">0.00 TZS</div>
			<div class="status">Account connected</div>
		</section>
	</main>
	<script type="module">
		import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
		import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './supabase-config.js';

		const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
		const welcome = document.getElementById('welcome');
		const logoutButton = document.getElementById('logoutButton');
		const { data: { session } } = await supabase.auth.getSession();

		if (!session) {
			window.location.href = 'login.html';
		} else {
			const name = session.user.user_metadata?.full_name;
			if (name) welcome.textContent = `Welcome back, ${name}.`;
		}

		logoutButton.addEventListener('click', async () => {
			await supabase.auth.signOut();
			window.location.href = 'login.html';
		});
	</script>
</body>
</html>
