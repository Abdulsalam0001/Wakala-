<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beneficiaries | Wakala</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./bank-pages.css"></head><body class="bank-page"><main class="bank-shell"><header class="bank-top"><a class="bank-brand" href="dashboard.html"><span class="brand-dot"></span>WAKALA</a><div class="bank-actions"><a class="bank-back" href="dashboard.html">← Overview</a></div></header><section class="bank-hero"><div class="bank-eyebrow">Saved recipients</div><h1 class="bank-title">Your trusted recipients.</h1><p class="bank-subtitle">Save people and accounts you transfer to regularly. This prototype stores saved beneficiaries locally on this device.</p></section><div class="bank-grid"><section class="bank-card"><div class="section-head"><h2>Add beneficiary</h2></div><form class="bank-form" id="form"><div class="form-row"><div class="field"><label>Name</label><input id="name" required placeholder="Recipient name"></div><div class="field"><label>Country</label><select id="country"><option>Nigeria</option><option>Kenya</option><option>Tanzania</option><option>Rwanda</option><option>Zanzibar</option></select></div></div><div class="field"><label>Account / phone</label><input id="account" required placeholder="Account number or mobile number"></div><div class="field"><label>Bank / provider</label><input id="provider" placeholder="Bank, mobile money or Wakala"></div><button class="bank-btn primary" type="submit">Save beneficiary</button><p id="message"></p></form></section><section class="bank-card"><div class="section-head"><h2>Saved beneficiaries</h2></div><div class="activity-list" id="list"></div></section></div></main><script>const key="wakala-beneficiaries";const list=document.getElementById("list"),form=document.getElementById("form"),msg=document.getElementById("message");function render(){const items=JSON.parse(localStorage.getItem(key)||"[]");list.innerHTML=items.length?items.map((x,i)=>`<div class="activity-item"><div class="activity-badge">${x.name.slice(0,2).toUpperCase()}</div><div class="item-main"><strong>${x.name}</strong><span>${x.country} · ${x.provider||"Wakala"} · ${x.account}</span></div><button class="bank-btn" onclick="removeBeneficiary(${i})">Remove</button></div>`).join(""):'<div class="empty">No beneficiaries saved yet.</div>'}window.removeBeneficiary=i=>{const x=JSON.parse(localStorage.getItem(key)||"[]");x.splice(i,1);localStorage.setItem(key,JSON.stringify(x));render()};form.addEventListener("submit",e=>{e.preventDefault();const x=JSON.parse(localStorage.getItem(key)||"[]");x.unshift({name:name.value.trim(),country:country.value,account:account.value.trim(),provider:provider.value.trim()});localStorage.setItem(key,JSON.stringify(x.slice(0,20)));form.reset();msg.textContent="Beneficiary saved on this device.";msg.style.color="var(--green)";render()});render();</script></body></html>
