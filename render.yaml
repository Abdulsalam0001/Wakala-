services:
  - type: web
    name: wakala-neon-staging
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://wakala-neon-staging.onrender.com
      - key: ADMIN_EMAIL
        sync: false
