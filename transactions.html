<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | Wakala</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./bank-pages.css"></head><body class="bank-page"><main class="bank-shell"><header class="bank-top"><a class="bank-brand" href="dashboard.html"><span class="brand-dot"></span>WAKALA</a><div class="bank-actions"><a class="bank-back" href="dashboard.html">← Overview</a></div></header><section class="bank-hero"><div class="bank-eyebrow">Statement & activity</div><h1 class="bank-title">Every movement, recorded.</h1><p class="bank-subtitle">Review deposits, transfers, payments and other activity across your Wakala wallet.</p></section><section class="bank-card"><div class="section-head"><h2>Transaction history</h2><a href="deposit.html">Add funds →</a></div><div class="table-wrap"><table class="bank-table"><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Status</th><th>Amount</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading transactions…</td></tr></tbody></table></div></section></main><script src="./api.js"></script><script>
const fmt=new Intl.NumberFormat(undefined,{maximumFractionDigits:8});
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function init(){
  const body=document.getElementById("rows");
  try{
    await WAKALA_API.me();
    const {transactions=[]}=await WAKALA_API.transactions(100);
    body.innerHTML=transactions.length?transactions.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString()}</td><td>${esc(t.description||"Wakala transaction")}</td><td>${esc(t.type||"—")}</td><td><span class="status-pill">${esc(t.status||"—")}</span></td><td>${fmt.format(Number(t.amount||0))} ${esc(t.currency||"")}</td></tr>`).join(""):'<tr><td colspan="5" class="empty">No transactions yet.</td></tr>';
  }catch(error){if(/authentication|required|session|expired/i.test(error.message||"")){location.href="login.html";return;}body.innerHTML='<tr><td colspan="5" class="empty">Unable to load activity. Please refresh and try again.</td></tr>';}
}
init();
</script></body></html>
