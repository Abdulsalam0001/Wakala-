```

  </div>

  <script src="../api.js"></script><script>
const q=id=>document.getElementById(id);
const statusBox=q("statusBox"),statusDot=q("statusDot"),statusText=q("statusText"),messageBox=q("messageBox");
const userInfo=q("userInfo"),userEmail=q("userEmail"),userId=q("userId"),userRole=q("userRole"),continueBtn=q("continueBtn"),logoutBtn=q("logoutBtn");
function setStatus(type,text){statusDot.className="dot "+type;statusText.textContent=text;}
function showMessage(type,text){messageBox.className="message "+type;messageBox.textContent=text;messageBox.style.display="block";}
async function checkAdmin(){
 setStatus("loading","Verifying administrator");
 try{
  const [{user},{role}]=await Promise.all([WAKALA_API.me(),WAKALA_API.adminMe()]);
  if(!user||!role)throw new Error("Administrator access denied");
  userEmail.textContent=user.email||"Authenticated user";
  userId.textContent="User ID: "+user.id;
  userRole.textContent=String(role).replaceAll("_"," ");
  userInfo.style.display="block";
  setStatus("success","Administrator verified");
  showMessage("success","Access granted. Your administrator permissions have been verified.");
  continueBtn.disabled=false;
  return true;
 }catch(error){
  setStatus("error","Verification failed");
  showMessage("error",/authentication|required|session/i.test(error.message||"")?"Please sign in with your Wakala administrator account.":(error.message||"Unable to verify administrator access."));
  return false;
 }
}
continueBtn.addEventListener("click",async()=>{continueBtn.disabled=true;if(await checkAdmin())location.href="./adminindex.html";else continueBtn.disabled=false;});
logoutBtn.addEventListener("click",async()=>{logoutBtn.disabled=true;try{await WAKALA_API.logout();}finally{location.href="../login.html";}});
(async()=>{try{const {user}=await WAKALA_API.me();if(!user){setStatus("error","Not signed in");showMessage("error","Please sign in with your Wakala administrator account.");return;}await checkAdmin();}catch{setStatus("error","Not signed in");showMessage("error","Please sign in with your Wakala administrator account.");}})();
</script>
