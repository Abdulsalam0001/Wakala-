<!DOCTYPE html>

<html lang="en">
<head>
  <script src="../auth-links.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Access | Wakala</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 15px;
      background: #111827;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.6;
      font-size: 14px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 15px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }

    .dot.success {
      background: #16a34a;
    }

    .dot.error {
      background: #dc2626;
    }

    .dot.loading {
      background: #f59e0b;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .message.info {
      display: block;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      color: #ffffff;
      transition: 0.2s ease;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .secondary {
      margin-top: 10px;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .secondary:hover {
      background: #f9fafb;
    }

    .user-info {
      display: none;
      margin-bottom: 20px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .user-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .user-info span {
      color: #6b7280;
      font-size: 13px;
      word-break: break-all;
    }

    .role {
      display: inline-flex;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>

</head>

<body>

  <div class="card">

```
<div class="logo">W</div>

<h1>Administrator Access</h1>

<p class="subtitle">
  Verifying your Wakala administrator account and permissions.
</p>

<div id="statusBox" class="status">
  <span id="statusDot" class="dot loading"></span>
  <span id="statusText">Checking authentication...</span>
</div>

<div id="messageBox" class="message"></div>

<div id="userInfo" class="user-info">
  <strong id="userEmail">—</strong>
  <span id="userId">—</span>
  <div id="userRole" class="role">—</div>
</div>

<button id="continueBtn" disabled>
  Continue to Admin Dashboard
</button>

<button id="logoutBtn" class="secondary">
  Sign Out
</button>

<div class="footer">
  Wakala Administrator Console
</div>
```

  </div>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    import {
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    } from "../supabase-config.js";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const statusBox = document.getElementById("statusBox");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    const messageBox = document.getElementById("messageBox");

    const userInfo = document.getElementById("userInfo");
    const userEmail = document.getElementById("userEmail");
    const userId = document.getElementById("userId");
    const userRole = document.getElementById("userRole");

    const continueBtn = document.getElementById("continueBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function setStatus(type, text) {
      statusDot.className = "dot " + type;
      statusText.textContent = text;
    }

    function showMessage(type, text) {
      messageBox.className = "message " + type;
      messageBox.textContent = text;
    }

    function hideMessage() {
      messageBox.className = "message";
      messageBox.textContent = "";
    }

    async function checkAdmin() {

      try {

        hideMessage();

        setStatus(
          "loading",
          "Checking administrator permissions..."
        );

        continueBtn.disabled = true;

        /*
         * IMPORTANT:
         *
         * Do NOT query admin_users directly from the browser.
         *
         * get_admin_role() is SECURITY DEFINER and performs
         * the administrator check safely inside PostgreSQL.
         */

        const {
          data: role,
          error
        } = await supabase.rpc("get_admin_role");

        if (error) {

          console.error(
            "Admin role RPC error:",
            error
          );

          throw new Error(
            "Unable to verify administrator access."
          );
        }

        console.log(
          "Admin role result:",
          role
        );

        if (!role) {

          setStatus(
            "error",
            "Administrator access denied"
          );

          showMessage(
            "error",
            "Your account is signed in, but it is not registered as an active Wakala administrator."
          );

          return false;
        }

        const normalizedRole =
          String(role).trim().toLowerCase();

        const allowedRoles = [
          "super_admin",
          "admin",
          "moderator"
        ];

        if (
          !allowedRoles.includes(normalizedRole)
        ) {

          setStatus(
            "error",
            "Administrator access denied"
          );

          showMessage(
            "error",
            "Your administrator role does not have access to this console."
          );

          return false;
        }

        const {
          data: {
            user
          }
        } = await supabase.auth.getUser();

        if (!user) {

          setStatus(
            "error",
            "Authentication required"
          );

          showMessage(
            "error",
            "Your session has expired. Please sign in again."
          );

          return false;
        }

        userEmail.textContent =
          user.email || "Authenticated user";

        userId.textContent =
          "User ID: " + user.id;

        userRole.textContent =
          normalizedRole.replace("_", " ");

        userInfo.style.display = "block";

        setStatus(
          "success",
          "Administrator verified"
        );

        showMessage(
          "success",
          "Access granted. Your administrator permissions have been verified."
        );

        continueBtn.disabled = false;

        return true;

      } catch (error) {

        console.error(
          "Admin verification failed:",
          error
        );

        setStatus(
          "error",
          "Verification failed"
        );

        showMessage(
          "error",
          error.message ||
          "Unable to verify administrator access."
        );

        return false;
      }
    }

    continueBtn.addEventListener(
      "click",
      async () => {

        continueBtn.disabled = true;

        const allowed =
          await checkAdmin();

        if (allowed) {

          window.location.href =
            "./adminindex.html";
        }
      }
    );

    logoutBtn.addEventListener(
      "click",
      async () => {

        logoutBtn.disabled = true;

        try {

          await supabase.auth.signOut();

        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        } finally {

          window.location.href =
            "../login.html";
        }
      }
    );

    /*
     * Handle the existing session.
     */

    async function initialize() {

      try {

        const {
          data: {
            session
          }
        } = await supabase.auth.getSession();

        if (!session) {

          setStatus(
            "error",
            "Not signed in"
          );

          showMessage(
            "error",
            "Please sign in with your Wakala administrator account."
          );

          return;
        }

        console.log(
          "Existing session user:",
          session.user.id,
          session.user.email
        );

        await checkAdmin();

      } catch (error) {

        console.error(
          "Initialization error:",
          error
        );

        setStatus(
          "error",
          "Initialization failed"
        );

        showMessage(
          "error",
          "Unable to initialize administrator access."
        );
      }
    }

    /*
     * Monitor login/logout changes.
     */

    supabase.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Auth state:",
          event,
          session?.user?.id
        );

        if (
          event === "SIGNED_OUT"
        ) {

          window.location.href =
            "../login.html";

          return;
        }

        if (
          event === "SIGNED_IN" ||
          event === "INITIAL_SESSION"
        ) {

          if (session) {
            await checkAdmin();
          }
        }
      }
    );

    initialize();

  </script>

</body>
</html>
