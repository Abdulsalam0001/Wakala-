<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit & Transfer Requests | Wakala Admin</title><script src="https://cdn.tailwindcss.com"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:#0f172a;color:#fff;padding:24px 14px;overflow:auto}.main{margin-left:245px;min-height:100vh}.nav{display:block;color:#cbd5e1;text-decoration:none;padding:12px 14px;border-radius:10px;margin:4px 0}.nav:hover,.nav.active{background:#1e293b;color:#fff}.top{background:#fff;border-bottom:1px solid #e2e8f0;padding:20px 28px;display:flex;justify-content:space-between;gap:14px;align-items:center}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 2px 8px #0f172a08}button,select{font:inherit}button{cursor:pointer}.status{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;text-transform:capitalize}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.processing{background:#dbeafe;color:#1d4ed8}@media(max-width:760px){.sidebar{position:static;width:auto;padding:12px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}.sidebar .brand{width:100%;padding:5px 8px 10px}.nav{padding:8px 10px;margin:0;font-size:13px}.main{margin-left:0}.top{padding:18px;align-items:flex-start;flex-direction:column}.content{padding:16px!important}}</style></head>
<body><aside class="sidebar"><div class="brand text-xl font-bold mb-5">Wakala <span class="text-xs font-normal text-slate-400">ADMIN</span></div><a class="nav" href="./adminindex.html">▦ Dashboard</a><a class="nav" href="./balances.html">₦ Wallet balances</a><a class="nav active" href="./requests.html">↔ Deposit & transfer requests</a><a class="nav" href="../dashboard.html">↗ User dashboard</a><button id="signOut" class="nav w-full text-left">⇥ Sign out</button></aside>
<main class="main"><header class="top"><div><h1 class="text-2xl font-bold">Deposit & transfer requests</h1><p class="text-sm text-slate-500 mt-1">Review customer requests and reconcile incoming deposits.</p></div><div class="text-sm text-slate-500" id="adminIdentity">Checking administrator access…</div></header>
<section class="content p-7"><div class="grid sm:grid-cols-3 gap-4 mb-5"><div class="card p-5"><p class="text-sm text-slate-500">Pending requests</p><p id="pendingCount" class="text-3xl font-bold mt-2">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Deposit requests</p><p id="depositCount" class="text-3xl font-bold mt-2">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Transfer requests</p><p id="transferCount" class="text-3xl font-bold mt-2">—</p></div></div>
<div class="card p-4 mb-5 flex flex-col sm:flex-row gap-3"><select id="statusFilter" class="border border-slate-200 rounded-lg px-3 py-3"><option value="pending">Pending</option><option value="all">All statuses</option><option value="approved">Approved</option><option value="processing">Processing</option><option value="rejected">Rejected</option><option value="completed">Completed</option></select><select id="typeFilter" class="border border-slate-200 rounded-lg px-3 py-3"><option value="all">Deposits & transfers</option><option value="deposit">Deposits only</option><option value="transfer">Transfers only</option></select><button id="refresh" class="rounded-lg bg-slate-900 text-white font-semibold px-5 py-3">Refresh queue</button></div>
<p id="notice" class="text-sm mb-4" role="status"></p><div id="requestList" class="space-y-4"><div class="card p-6 text-slate-500">Loading requests…</div></div></section></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '../supabase-config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));let queue=[];
function notice(message,error=false){$('notice').textContent=message;$('notice').className='text-sm mb-4 '+(error?'text-red-700':'text-slate-600')}
async function authenticate(){const {data:{session},error}=await supabase.auth.getSession();if(error)throw error;if(!session){location.href='../login.html';return false}const {data:role,error:roleError}=await supabase.rpc('get_admin_role');if(roleError)throw roleError;if(!role||!['super_admin','admin'].includes(role)){document.body.innerHTML='<main class="p-8 font-sans"><h1 class="text-2xl font-bold">Administrator access required</h1><p class="mt-2">Your account is not authorised to view payment requests.</p><a class="underline" href="../dashboard.html">Return to Wakala</a></main>';return false}$('adminIdentity').textContent=session.user.email+' · '+role.replaceAll('_',' ');return true}
function detailsText(r){const d=r.details||{};if(r.request_type==='deposit')return ['Method: '+(d.method||'Bank transfer'),'Destination: '+(d.payment_provider||'OPay')+' · '+(d.destination_account||'Account not supplied'),'Sender: '+(d.sender_name||'Not supplied'),'Bank reference: '+(d.sender_transaction_reference||'Not supplied'),'Account name: customer must confirm with official support before sending'].join('\n');return ['Recipient: '+(d.recipient_name||'Not supplied'),'Recipient type: '+(d.recipient_type||'Not supplied'),'Destination bank: '+(d.bank_name||'Not supplied'),'Destination account: '+(d.destination_account||'Wakala user'),'Receive estimate: '+(d.receive_currency||'')+' '+(d.receive_amount_estimate??'—'),'Note: '+(d.note||'None')].join('\n')}
function card(r){const pending=r.status==='pending';const title=r.request_type==='deposit'?'Deposit request':'Transfer request';const actions=pending?'<div class="flex flex-wrap gap-2 mt-4"><button data-action="approve" data-id="'+r.id+'" class="rounded-lg bg-emerald-600 text-white font-semibold px-4 py-2">'+(r.request_type==='deposit'?'Verify & credit deposit':'Approve for processing')+'</button><button data-action="reject" data-id="'+r.id+'" class="rounded-lg bg-white border border-red-200 text-red-700 font-semibold px-4 py-2">Reject'+(r.request_type==='transfer'?' / release hold':'')+'</button></div>':(r.request_type==='transfer'&&r.status==='processing'?'<div class="flex flex-wrap gap-2 mt-4"><button data-action="complete" data-id="'+r.id+'" class="rounded-lg bg-emerald-600 text-white font-semibold px-4 py-2">Mark completed after actual transfer</button><button data-action="reject" data-id="'+r.id+'" class="rounded-lg bg-white border border-red-200 text-red-700 font-semibold px-4 py-2">Cancel & release hold</button></div>':'');return '<article class="card p-5"><div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3"><div><div class="flex flex-wrap items-center gap-2"><h2 class="font-bold text-lg">'+title+'</h2><span class="status '+esc(r.status)+'">'+esc(r.status)+'</span></div><p class="text-sm text-slate-500 mt-1">'+esc(r.reference)+' · '+esc(new Date(r.created_at).toLocaleString())+'</p><p class="text-sm mt-2">'+esc(r.user_name||'Customer')+' · '+esc(r.user_email||r.user_id)+'</p></div><div class="md:text-right"><p class="text-2xl font-bold">'+esc(r.currency)+' '+esc(Number(r.amount).toLocaleString(undefined,{maximumFractionDigits:8}))+'</p><p class="text-xs text-slate-500 mt-1">'+(r.request_type==='deposit'?'Match incoming payment before crediting':'Request only; approval does not send money or debit the wallet')+'</p></div></div><pre class="whitespace-pre-wrap break-words text-sm bg-slate-50 rounded-xl p-4 mt-4 font-sans">'+esc(detailsText(r))+'</pre>'+(r.admin_note?'<p class="text-sm mt-3"><strong>Admin note:</strong> '+esc(r.admin_note)+'</p>':'')+actions+'</article>'}
async function load(){$('requestList').innerHTML='<div class="card p-6 text-slate-500">Loading requests…</div>';const status=$('statusFilter').value,type=$('typeFilter').value;const {data,error}=await supabase.rpc('list_admin_wallet_requests',{p_status:status,p_type:type});if(error){$('requestList').innerHTML='';notice(error.message+' — apply supabase/wallet-requests.sql in Supabase SQL Editor if not installed.',true);return}queue=data||[];const {data:all,error:allError}=await supabase.rpc('list_admin_wallet_requests',{p_status:'all',p_type:'all'});if(!allError){$('pendingCount').textContent=all.filter(r=>r.status==='pending').length;$('depositCount').textContent=all.filter(r=>r.request_type==='deposit'&&r.status==='pending').length;$('transferCount').textContent=all.filter(r=>r.request_type==='transfer'&&r.status==='pending').length}$('requestList').innerHTML=queue.length?queue.map(card).join(''):'<div class="card p-8 text-center"><h2 class="font-bold">No requests found</h2><p class="text-sm text-slate-500 mt-2">New customer deposit and transfer requests will appear here.</p></div>';notice('Showing '+queue.length+' request(s).')}
$('requestList').addEventListener('click',async event=>{const button=event.target.closest('button[data-action]');if(!button)return;const row=queue.find(item=>String(item.id)===button.dataset.id);if(!row)return;const action=button.dataset.action;const confirmText=action==='approve'&&row.request_type==='deposit'?'Only continue after independently matching the incoming payment to this customer and amount. This credits the wallet.':action==='approve'?'Approve this request and reserve its amount for processing? This does not send money.':action==='reject'?'Reject/cancel this request? For a transfer, the reserved funds will be released.':action==='complete'?'Confirm the transfer was actually executed outside Wakala. This will finalize the debit.':'Mark this transfer request as processing?';if(!confirm(confirmText))return;const note=prompt(action==='approve'&&row.request_type==='deposit'?'Required: record the incoming payment reference or reconciliation evidence.':'Required for completion: record the actual settlement confirmation. For other actions, add a reason if useful.','')||'';button.disabled=true;const decision=action==='approve'?'approve':action==='reject'?'reject':action==='complete'?'complete':'processing';const {error}=await supabase.rpc('review_wallet_request',{p_request_id:Number(row.id),p_decision:decision,p_admin_note:note});if(error){notice(error.message,true);button.disabled=false;return}notice(action==='approve'&&row.request_type==='deposit'?'Deposit approved and wallet credited. Reference: '+row.reference:action==='complete'?'Transfer marked completed and debit recorded: '+row.reference:'Request updated: '+row.reference);await load()});
$('refresh').addEventListener('click',load);$('statusFilter').addEventListener('change',load);$('typeFilter').addEventListener('change',load);$('signOut').addEventListener('click',async()=>{await supabase.auth.signOut();location.href='../login.html'});try{if(await authenticate())await load()}catch(error){notice(error.message||'Unable to verify administrator access.',true)}
</script></body></html>
