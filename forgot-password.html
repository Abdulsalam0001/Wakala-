<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./supabase-config.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Wakala</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f6f8fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 15px 45px rgba(0,0,0,.07);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #2563eb;
    }

    .logo p {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .description {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .back {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    .back a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      <h1>Wakala<span>.</span></h1>
      <p>Secure account recovery</p>
    </div>

    <h2>Forgot your password?</h2>

    <p class="description">
      Enter the email address associated with your Wakala account.
      We'll send you a secure link to create a new password.
    </p>

    <form id="resetForm">

      <label for="email">
        Email address
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <button
        type="submit"
        id="submitButton"
      >
        Send Reset Link
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="back">
      <a href="login.html">← Back to login</a>
    </div>

  </div>

</div>

<script>

  const form =
    document.getElementById("resetForm");

  const emailInput =
    document.getElementById("email");

  const button =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      emailInput.value.trim().toLowerCase();

    if (!email) {

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent = "Sending...";


    try {

      const { error } =
        await supabase.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://wakala.cfd/reset-password.html"
          }
        );


      if (error) {
        throw error;
      }


      /*
       * Security best practice:
       * Don't reveal whether an email exists.
       */

      showMessage(
        "If an account exists for this email, " +
        "a password reset link has been sent. " +
        "Please check your inbox and spam folder.",
        "success"
      );


      emailInput.value = "";


    } catch (error) {

      console.error(
        "Password reset error:",
        error
      );

      /*
       * Don't expose account existence.
       */

      showMessage(
        "If an account exists for this email, " +
        "a password reset link has been sent. " +
        "Please check your inbox and spam folder.",
        "success"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Send Reset Link";

    }

  });

</script>

</body>
</html>
